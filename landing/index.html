<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rambly: your first draft is already in your head</title>
    <meta name="description" content="Your first draft is already in your head. Say it. Rambly writes it down. Join the waitlist for early access." />
    <meta property="og:title" content="Your first draft is already in your head." />
    <meta property="og:description" content="Say it. Rambly writes it down." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen text-ink">
    <a href="#signup" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:bg-surface focus:p-2 focus:rounded-ui">Skip to signup</a>

    <header class="mx-auto flex max-w-5xl items-center px-4 pt-4 sm:px-6 sm:pt-6">
      <a href="/" class="flex min-h-12 items-center gap-2 rounded-ui" aria-label="Rambly home">
        <span class="flex size-[36px] items-center justify-center rounded-ui bg-ink" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="white" stroke-width="28" stroke-linecap="round">
            <path d="M44 72 C66 36 98 36 120 72 S174 108 196 72 C202 62 207 56 212 52" />
            <path d="M44 132 H212" />
            <path d="M44 180 H212" />
            <path d="M44 228 H140" />
          </svg>
        </span>
        <span class="text-lead font-bold tracking-tight">Rambly</span>
      </a>
    </header>

    <main>
      <!-- One screen: text and form left, demo right (below on phones). -->
      <section class="mx-auto grid max-w-5xl gap-12 px-4 pt-12 pb-24 sm:px-6 sm:pt-24 lg:grid-cols-[1fr_1fr] lg:items-center" aria-labelledby="headline">
        <div>
          <h1 id="headline" class="text-hero font-semibold tracking-tight">Your first draft is already in your <span class="text-accent">head.</span></h1>
          <p class="mt-4 text-lead text-muted">Say it. Rambly writes it down.</p>

          <div id="signup" class="mt-6">
            <form data-signup novalidate class="max-w-md">
              <label for="email" class="sr-only">Your email</label>
              <div class="flex flex-col gap-2 sm:flex-row">
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required
                  class="min-h-12 w-full rounded-ui border border-line bg-surface px-4 text-body placeholder:text-muted" placeholder="you@university.edu" />
                <button type="submit"
                  class="min-h-12 w-full shrink-0 rounded-ui bg-accent px-6 text-body font-semibold text-white transition-opacity hover:opacity-90 disabled:cursor-wait disabled:opacity-70 sm:w-auto">Get early access</button>
              </div>
              <div class="absolute -left-[9999px]" aria-hidden="true">
                <label>Website <input name="website" type="text" tabindex="-1" autocomplete="off" /></label>
              </div>
              <p data-status role="status" aria-live="polite" class="mt-2 text-small font-semibold empty:hidden"></p>
            </form>

            <section data-step2 hidden class="max-w-md rounded-ui border border-line bg-surface p-6" aria-labelledby="step2-title">
              <p data-step2-status role="status" aria-live="polite" class="mb-4 text-body font-semibold empty:hidden"></p>
              <h2 id="step2-title" class="text-lead font-semibold">Optional: two taps</h2>
              <form data-step2-form class="mt-4">
                <fieldset>
                  <legend tabindex="-1" class="text-small font-semibold">Your role</legend>
                  <div class="mt-2 flex flex-wrap gap-2">
                    <label class="choice"><input type="radio" name="role" value="masters" /> Master's</label>
                    <label class="choice"><input type="radio" name="role" value="phd" /> PhD</label>
                    <label class="choice"><input type="radio" name="role" value="faculty" /> Faculty</label>
                    <label class="choice"><input type="radio" name="role" value="staff_researcher" /> Staff or researcher</label>
                    <label class="choice"><input type="radio" name="role" value="other" /> Other</label>
                  </div>
                </fieldset>
                <fieldset class="mt-6">
                  <legend class="text-small font-semibold">Mainly for</legend>
                  <div class="mt-2 flex flex-wrap gap-2">
                    <label class="choice"><input type="radio" name="use_case" value="drafting" /> Drafting</label>
                    <label class="choice"><input type="radio" name="use_case" value="ideas" /> Ideas</label>
                    <label class="choice"><input type="radio" name="use_case" value="teaching" /> Teaching</label>
                    <label class="choice"><input type="radio" name="use_case" value="personal" /> Personal notes</label>
                    <label class="choice"><input type="radio" name="use_case" value="other" /> Other</label>
                  </div>
                </fieldset>
                <div class="mt-6 flex flex-col gap-2 sm:flex-row">
                  <button type="submit" data-step2-save class="min-h-12 rounded-ui bg-accent px-6 text-body font-semibold text-white disabled:opacity-70">Save</button>
                  <button type="button" data-step2-skip class="min-h-12 rounded-ui px-6 text-body font-semibold text-ink underline-offset-4 hover:underline">Skip</button>
                </div>
              </form>
            </section>
          </div>
        </div>

        <div data-demo></div>
      </section>
    </main>

    <footer class="border-t border-line">
      <div class="mx-auto flex max-w-5xl flex-col gap-2 px-4 py-12 text-small text-muted sm:flex-row sm:items-center sm:gap-6 sm:px-6">
        <a href="/privacy" class="inline-flex min-h-12 items-center underline underline-offset-4">Privacy</a>
        <span>Contact: [contact email]</span>
        <span>&copy; 2026 Rearguard Online</span>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
